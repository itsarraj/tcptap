[package]
name = "tcptap"
version = "0.1.0"
edition = "2021"
description = "A zero-daemon TCP tap and chaos proxy — duplex inspection, latency injection, bandwidth throttling, and socket severing"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/tcptap"
readme = "README.md"
keywords = ["tcp", "proxy", "chaos", "tap", "throttling"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[lib]
name = "tcptap"
path = "src/lib.rs"

[[bin]]
name = "tcptap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
colored = "2"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
